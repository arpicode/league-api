spring:
  application:
    name: league-api
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://localhost:5432/meeple_league
    username: meeple_league
    password: meeple_league_local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    default-schema: league

logging:
  level:
    '[io.arpicode.leagueapi]': DEBUG
